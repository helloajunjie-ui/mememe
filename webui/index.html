<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白绫 Bailing · 自我完善 AI 智能体</title>
<style>
  :root {
    --bg: #F5F5F5;
    --panel: #FFFFFF;
    --border: #E4E4E4;
    --text: #1A1B1C;
    --text-2: #6B7280;
    --bubble-user: #95EC69;
    --bubble-user-text: #1A1B1C;
    --bubble-bailing: #FFFFFF;
    --accent: #3B82F6;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  /* 顶部栏 */
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header .title { font-size: 17px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--text-2); }
  .badges { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .badge {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    background: #EEF2FF;
    color: #3B5BDB;
    border: 1px solid #DCE4FF;
    white-space: nowrap;
  }
  .badge.gray { background: #F3F4F6; color: #4B5563; border-color: #E5E7EB; }
  /* 聊天区 */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 18px 0;
  }
  .msg-wrap { display: flex; padding: 6px 18px; }
  .msg-wrap .avatar {
    width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; user-select: none;
  }
  .msg-wrap.bailing .avatar { background: #EEF2FF; margin-right: 10px; }
  .msg-wrap.user .avatar { background: #E6F7D9; margin-left: 10px; order: 2; }
  .bubble {
    max-width: 76%;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.65;
    word-break: break-word;
  }
  .msg-wrap.bailing .bubble { background: var(--bubble-bailing); border: 1px solid var(--border); }
  .msg-wrap.user { flex-direction: row-reverse; }
  .msg-wrap.user .bubble { background: var(--bubble-user); }
  .msg-wrap.user .avatar { order: 1; }
  .bubble p { margin: 4px 0; }
  .bubble ul, .bubble ol { margin: 6px 0 6px 20px; }
  .bubble pre {
    background: #F6F8FA; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; overflow-x: auto;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12.5px; margin: 8px 0;
  }
  .bubble code { font-family: Consolas, "Courier New", monospace; font-size: 12.5px;
    background: #F1F1F1; padding: 1px 5px; border-radius: 4px; }
  .bubble pre code { background: none; padding: 0; }
  .bubble strong { font-weight: 600; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 10px 0 6px; line-height: 1.35; }
  .bubble h1 { font-size: 19px; } .bubble h2 { font-size: 17px; }
  .bubble h3 { font-size: 15.5px; } .bubble h4 { font-size: 14.5px; }
  .bubble a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(59,130,246,.35); }
  .bubble a:hover { text-decoration: underline; }
  .bubble em { font-style: italic; }
  .bubble blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid #D1D5DB; background: rgba(0,0,0,.02); color: var(--text-2); border-radius: 0 6px 6px 0; }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; width: 100%; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .bubble th { background: rgba(0,0,0,.03); font-weight: 600; }
  .bubble tr:nth-child(even) td { background: rgba(0,0,0,.015); }
  .bubble li { margin: 2px 0; }
  .bubble .time { font-size: 10.5px; color: var(--text-2); text-align: right; margin-top: 6px; }
  /* 思考中 */
  .thinking { display: flex; align-items: center; gap: 8px; }
  .thinking .dot { width: 6px; height: 6px; border-radius: 50%;
    background: #9CA3AF; animation: blink 1.2s infinite; }
  .thinking .dot:nth-child(2){ animation-delay: 0.2s; }
  .thinking .dot:nth-child(3){ animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }
  /* 任务执行卡片：状态条 + 进度 + 计划 + 折叠流水 */
  .task-card { font-size: 13px; line-height: 1.6; min-width: 300px; max-width: 640px; }
  .task-head { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #6B7280; margin-bottom: 5px; }
  .task-type {
    color: #3B5BDB; background: #EEF2FF; border: 1px solid #DCE4FF;
    border-radius: 20px; padding: 1px 9px; font-size: 10.5px; white-space: nowrap;
  }
  .task-status { margin-left: auto; font-size: 10.5px; white-space: nowrap; }
  .task-status.err { color: #DC2626; }
  .task-status.done { color: #059669; }
  .task-goal {
    font-size: 12px; color: #374151; background: #FAFAF8;
    border: 1px solid #E4E3DD; border-radius: 8px; padding: 5px 10px;
    margin: 2px 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .task-now { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #0369A1; padding: 3px 0; }
  .task-now .spinner {
    width: 11px; height: 11px; flex-shrink: 0; border: 2px solid #BFDBFE;
    border-top-color: #3B82F6; border-radius: 50%; animation: spin .8s linear infinite;
  }
  .task-now .stepno { font-weight: 400; color: #9CA3AF; font-size: 11px; }
  .task-now .actv { font-weight: 700; color: #2563EB; font-family: Consolas, 'Courier New', monospace; }
  .task-now .task-arg {
    color: #6B7280; font-family: Consolas, 'Courier New', monospace; font-size: 11.5px;
    max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: inline-block; vertical-align: bottom;
  }
  .task-think {
    display: none; font-size: 11.5px; color: #6D5BB5; background: #F7F5FF;
    border: 1px solid #EAE4FA; border-radius: 6px; padding: 3px 9px;
    margin: 2px 0 4px; line-height: 1.55; max-height: 44px; overflow: hidden;
  }
  .task-think::before { content: '在想：'; font-weight: 600; color: #8B7BC8; }
  .task-now.err { color: #DC2626; }
  .task-now.done { color: #059669; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .task-progress { display: flex; align-items: center; gap: 8px; margin: 6px 0 4px; }
  .task-progress .bar { flex: 1; height: 6px; background: #EEF0F3; border-radius: 3px; overflow: hidden; }
  .task-progress .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg,#60A5FA,#3B82F6); border-radius: 3px; transition: width .4s ease; }
  .task-progress .bar.indeterminate > i { width: 36% !important; animation: slide 1.2s ease-in-out infinite; }
  .task-progress .txt { font-size: 11px; color: #6B7280; flex-shrink: 0; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .task-plan { position: relative; margin: 4px 0 6px; max-height: 168px; overflow-y: auto; }
  .task-plan .pg { font-size: 10.5px; color: #8A8F98; font-weight: 600; margin: 4px 0 1px; }
  .task-plan .ps {
    font-size: 12px; color: #6B7280; padding: 1px 5px; border-radius: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .task-plan .ps.cur { background: #EFF6FF; color: #1D4ED8; font-weight: 500; }
  .task-plan .ps.done { color: #059669; text-decoration: line-through; }
  .task-plan .ps.fail { color: #DC2626; }
  .task-plan .ps.todo { color: #9CA3AF; }
  .task-flow-head {
    display: flex; align-items: center; gap: 6px; font-size: 11px; color: #6B7280;
    margin: 6px 0 2px; cursor: pointer; user-select: none; display: none;
  }
  .task-flow-head:hover { color: #1F2937; }
  .task-flow-head .count { background: #F3F4F6; border-radius: 10px; padding: 0 7px; font-size: 10.5px; }
  .task-flow-head .toggle { margin-left: auto; }
  .task-flow { display: flex; flex-direction: column; }
  .task-flow .tl { display: flex; gap: 7px; font-size: 11.5px; color: #4B5563; padding: 1px 0; align-items: baseline; }
  .task-flow .tl .st { flex-shrink: 0; width: 12px; text-align: center; }
  .task-flow .tl .ts { color: #9CA3AF; flex-shrink: 0; font-family: Consolas, "Courier New", monospace; }
  .task-flow .tl .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-flow .tl .actv { font-weight: 600; color: #3B5BDB; font-family: Consolas, 'Courier New', monospace; }
  .task-flow .tl .flow-obj { color: #9CA3AF; font-family: Consolas, 'Courier New', monospace; }
  .task-flow .tl.run .nm { color: #0369A1; font-weight: 600; }
  .task-flow .tl.err .nm { color: #DC2626; }
  .task-review { margin-left: 8px; font-size: 10.5px; color: #3B82F6; cursor: pointer; white-space: nowrap; }
  .task-review:hover { text-decoration: underline; }
  /* 输入区 */
  footer {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 10px 18px 14px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  footer textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.5;
    outline: none;
    min-height: 44px;
    max-height: 140px;
  }
  footer textarea:focus { border-color: var(--accent); }
  footer button {
    height: 44px;
    padding: 0 22px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  footer button:disabled { background: #A5B4FC; cursor: not-allowed; }
  .hint { font-size: 11px; color: var(--text-2); margin-left: auto; align-self: center; }

  /* AI 配置面板 */
  #cfgBtn {
    margin-left: 12px; height: 32px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: #fff; color: var(--text); font-size: 13px; cursor: pointer;
    white-space: nowrap;
  }
  #cfgBtn:hover { border-color: var(--accent); color: var(--accent); }
  .modal {
    position: fixed; inset: 0; background: rgba(15,23,42,.45);
    display: flex; align-items: center; justify-content: center; z-index: 99;
  }
  .modal-card {
    width: min(560px, 92vw); background: #fff; border-radius: 14px;
    box-shadow: 0 12px 40px rgba(15,23,42,.25); overflow: hidden;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 15px;
  }
  .modal-x { cursor: pointer; font-size: 20px; color: var(--text-2); line-height: 1; }
  .modal-x:hover { color: var(--text); }
  .modal-body { padding: 16px 18px; max-height: 60vh; overflow-y: auto; }
  .modal-foot {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px; border-top: 1px solid var(--border);
  }
  .cfg-row { margin-bottom: 14px; }
  .cfg-row label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 5px; }
  .cfg-row input {
    width: 100%; box-sizing: border-box; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none;
  }
  .cfg-row input:focus { border-color: var(--accent); }
  .cfg-row2 { display: flex; }
  .cfg-model-row { display: flex; gap: 8px; align-items: center; }
  .cfg-combo { position: relative; flex: 1; }
  .cfg-combo input { width: 100%; box-sizing: border-box; }
  .cfg-mlist {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    max-height: 220px; overflow-y: auto; background: #fff;
    border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(15,23,42,.14); z-index: 20; display: none;
  }
  .cfg-mlist.show { display: block; }
  .cfg-mlist .mi { padding: 8px 12px; font-size: 13px; cursor: pointer; word-break: break-all; }
  .cfg-mlist .mi:hover { background: #f0f2ff; }
  .cfg-mlist .mi.empty { color: var(--text-2); cursor: default; background: none; }
  .cfg-mask { font-size: 12px; color: var(--text-2); margin-top: 4px; display: block; }
  .cfg-presets { display: flex; flex-wrap: wrap; gap: 8px; }
  .preset {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 7px;
    background: #f8f9ff; color: var(--text); font-size: 12px; cursor: pointer;
  }
  .preset:hover { border-color: var(--accent); color: var(--accent); }
  .cfg-msg { font-size: 12px; margin-top: 4px; min-height: 18px; }
  .cfg-msg.ok { color: #52C41A; }
  .cfg-msg.err { color: #EA6668; }
  .btn-ghost, .btn-primary {
    padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none;
  }
  .btn-ghost { background: #eef0f7; color: var(--text); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost:disabled, .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
  @media (max-width: 600px) {
    .bubble { max-width: 88%; }
    header .badges { display: none; }
  }
</style>
</head>
<body>
<header>
  <div>
    <span class="title">白绫 Bailing</span>
    <span class="sub" style="margin-left:8px;">自我完善 AI 智能体 · 本地运行</span>
  </div>
  <div class="badges" id="badges">
    <span class="badge gray">启动中...</span>
  </div>
  <button id="cfgBtn" onclick="openCfg()" title="AI 接入配置">⚙ 配置</button>
</header>

<main id="chat"></main>

<!-- AI 接入配置面板 -->
<div id="cfgModal" class="modal" style="display:none;">
  <div class="modal-card">
    <div class="modal-head">
      <b>AI 接入配置</b>
      <span class="modal-x" onclick="closeCfg()">×</span>
    </div>
    <div class="modal-body">
      <div class="cfg-row">
        <label>API 地址（OpenAI 兼容 base_url）</label>
        <input id="cfgBase" type="text" placeholder="https://api.deepseek.com" />
      </div>
      <div class="cfg-row">
        <label>API Key（留空 = 保留原值）</label>
        <input id="cfgKey" type="password" placeholder="sk-..." autocomplete="off" />
        <span class="cfg-mask" id="cfgKeyMask"></span>
      </div>
      <div class="cfg-row">
        <label>模型名（点下拉选，也可手动输入）</label>
        <div class="cfg-model-row">
          <div class="cfg-combo">
            <input id="cfgModel" type="text" placeholder="点击选择模型" readonly
                   onfocus="showModels()" onclick="showModels()"
                   title="点击下拉选择模型" style="cursor:pointer" />
            <div class="cfg-mlist" id="cfgMList"></div>
          </div>
          <button class="preset" id="cfgFetchModels" onclick="fetchModels()" title="从当前 API 地址自动获取模型列表">获取模型</button>
        </div>
        <span class="cfg-mask" id="cfgModelHint"></span>
      </div>
      <div class="cfg-row2">
        <div class="cfg-row" style="flex:1;margin-right:10px;">
          <label>温度（0~2，默认 0.7）</label>
          <input id="cfgTemp" type="number" step="0.1" min="0" max="2" />
        </div>
        <div class="cfg-row" style="flex:1;">
          <label>max_tokens（默认 4096）</label>
          <input id="cfgTokens" type="number" step="256" min="256" />
        </div>
      </div>
      <div class="cfg-row">
        <label>预设快捷切换</label>
        <div class="cfg-presets">
          <button class="preset" onclick="preset('deepseek')">DeepSeek</button>
          <button class="preset" onclick="preset('openai')">OpenAI</button>
          <button class="preset" onclick="preset('grok')">Grok</button>
          <button class="preset" onclick="preset('ollama')">本地 Ollama</button>
          <button class="preset" onclick="preset('moonshot')">Moonshot</button>
        </div>
      </div>
      <div id="cfgMsg" class="cfg-msg"></div>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" onclick="testCfg()">测试连接</button>
      <span style="flex:1"></span>
      <button class="btn-ghost" onclick="closeCfg()">取消</button>
      <button class="btn-primary" onclick="saveCfg()">保存并重载</button>
    </div>
  </div>
</div>

<footer>
  <textarea id="input" placeholder="和白绫说点什么...（Enter 发送 / Shift+Enter 换行）"></textarea>
  <button id="send" onclick="send()">发送</button>
  <span class="hint">Esc 清空</span>
</footer>

<script>
"use strict";
var chat = document.getElementById("chat");
var input = document.getElementById("input");
var sendBtn = document.getElementById("send");

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
/* 轻量 markdown 渲染：代码块/行内代码/粗体/列表/换行（先整体转义防 XSS） */
function renderMd(text) {
  text = escapeHtml(text);
  var blocks = [];
  text = text.replace(/```([\s\S]*?)```/g, function(m,c){
    blocks.push("<pre><code>"+c.replace(/^\n|\n$/g,"").replace(/^[a-zA-Z0-9_+\-.]+\n/,"")+"</code></pre>");
    return "\u0000B"+(blocks.length-1)+"\u0000";
  });
  function inline(t){
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\[([^\]]+)\]\(((?:https?:|mailto:|\/|#)[^)\s]*)\)/g, function(m,txt,h){
      return '<a href="'+h+'" target="_blank" rel="noopener noreferrer">'+txt+'</a>';
    });
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
    return t;
  }
  var html = "", inUl = false, inOl = false, i;
  function closeLists(){ if(inUl){html+="</ul>";inUl=false;} if(inOl){html+="</ol>";inOl=false;} }
  var lines = text.split("\n");
  for (i=0;i<lines.length;i++){
    var raw = lines[i];
    /* 表格：| a | b |  +  |---|---| 分隔行 */
    if (/^\s*\|.*\|\s*$/.test(raw) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      closeLists();
      var rows=[raw, lines[i+1]]; i+=2;
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(lines[i]); i++; }
      i--;
      var thead=true, body=[];
      for(var r=0;r<rows.length;r++){
        if(r===1){ continue; }
        var cells = rows[r].trim().replace(/^\||\|$/g,"").split("|");
        var tag = thead?"th":"td", tr="<tr>";
        for(var c2=0;c2<cells.length;c2++){ tr += "<"+tag+">"+inline(cells[c2].trim())+"</"+tag+">"; }
        tr += "</tr>";
        body.push(tr);
        thead = false;
      }
      html += "<table><thead>"+body[0]+"</thead><tbody>"+body.slice(1).join("")+"</tbody></table>";
      continue;
    }
    /* 分割线 */
    if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(raw)){ closeLists(); html+="<hr>"; continue; }
    /* 标题 */
    var h = raw.match(/^\s*(#{1,6})\s+(.*)$/);
    if(h){ closeLists(); var lv=h[1].length; html += "<h"+lv+">"+inline(h[2])+"</h"+lv+">"; continue; }
    /* 引用（连续行合并） */
    if (/^\s*(?:>|&gt;)\s?/.test(raw)){
      closeLists();
      var q=[], qi=i;
      while(qi<lines.length && /^\s*(?:>|&gt;)\s?/.test(lines[qi])){ q.push(lines[qi].replace(/^\s*(?:>|&gt;)\s?/,"")); qi++; }
      i=qi-1;
      html += "<blockquote>"+inline(q.join("\n"))+"</blockquote>";
      continue;
    }
    var ul = raw.match(/^\s*[-*]\s+(.*)$/);
    var ol = raw.match(/^\s*\d+[.、]\s+(.*)$/);
    if (ul){ if(!inUl){html+="<ul>";inUl=true;} if(inOl){html+="</ol>";inOl=false;} html+="<li>"+inline(ul[1])+"</li>"; continue; }
    if (ol){ if(!inOl){html+="<ol>";inOl=true;} if(inUl){html+="</ul>";inUl=false;} html+="<li>"+inline(ol[1])+"</li>"; continue; }
    closeLists();
    if(raw.trim()==="") continue;
    if(/^\u0000B\d+\u0000$/.test(raw.trim())){
      html += raw.replace(/\u0000B(\d+)\u0000/g,function(m,j){return blocks[+j];});
    } else {
      html += inline(raw) + "<br>";
    }
  }
  closeLists();
  return html;
}

function fmtTime(d) {
  function p(n){ return (n<10?"0":"")+n; }
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}

function toolAction(name) {
  var m = TOOL_VERBS[name];
  if (m) return m;
  return {v: (name.split("_")[0] || name).toUpperCase(), zh: toolLabel(name)};
}
function toolLabel(name) {
  if (TOOL_LABELS[name]) return TOOL_LABELS[name];
  if (name.indexOf("mcp_blender_") === 0) return "Blender·" + name.slice(12).replace(/_/g, " ");
  if (name.indexOf("mcp_godot_") === 0) return "Godot·" + name.slice(10).replace(/_/g, " ");
  if (name.indexOf("mcp_") === 0) return "MCP·" + name.slice(4).replace(/_/g, " ");
  if (name.indexOf("fs_") === 0) return "文件·" + name.slice(3).replace(/_/g, " ");
  if (name.indexOf("net_") === 0) return "网络·" + name.slice(4).replace(/_/g, " ");
  if (name.indexOf("feishu_") === 0) return "飞书·" + name.slice(7).replace(/_/g, " ");
  return name.replace(/_/g, " ");
}
/* 参数摘要：从工具参数里挑最像目标字段的值，让人一眼看懂在做什么 */
function argsSummary(args) {
  if (!args) return "";
  if (typeof args === "string") { try { args = JSON.parse(args); } catch (e) { return args.slice(0, 80); } }
  if (typeof args === "string") return args.slice(0, 80);
  if (typeof args === "number") return String(args);
  if (!args || typeof args !== "object") return "";
  var keys = ["command", "path", "file", "query", "message", "url", "name",
              "target", "prompt", "text", "keyword", "dir", "goal", "args", "content"];
  for (var i = 0; i < keys.length; i++) {
    var v = args[keys[i]];
    if (v === undefined || v === null) continue;
    if (typeof v === "string") return v.slice(0, 90);
    if (typeof v === "number") return String(v);
    if (Array.isArray(v)) return v.slice(0, 3).join(", ").slice(0, 90);
    if (typeof v === "object") { try { return JSON.stringify(v).slice(0, 90); } catch (e) {} }
  }
  return "";
}
function fmtClock(ts) {
  var d = ts ? new Date(ts) : new Date();
  function p(n){ return (n<10?"0":"")+n; }
  return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}
/* 自动滚动：仅在用户停留在底部附近时跟随，向上翻阅历史不打扰 */
function maybeScroll() {
  if (chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120) {
    chat.scrollTop = chat.scrollHeight;
  }
}
function taskTypeName(t) {
  var map = {C0:"对话", C1:"即时任务", C2:"规划任务", C3:"任务集合"};
  return map[t] || (t || "任务");
}

/* 状态条：显示当前正在执行的工具（或思考中） */
function updateNow(panel) {
  var now = panel.querySelector(".task-now");
  if (!now) return;
  var cur = null;
  for (var i = panel._toolSeq.length - 1; i >= 0; i--) {
    var t = panel._tools[panel._toolSeq[i]];
    if (t.status === "run") { cur = t; cur.step = panel._toolSeq[i]; break; }
  }
  if (cur) {
    now.classList.remove("err", "done");
    var act = toolAction(cur.name);
    now.innerHTML = '<span class="spinner"></span><span class="now-text">正在：' +
      '<span class="actv">' + escapeHtml(act.v) + '</span> ' + escapeHtml(act.zh) +
      (cur.arg ? ' <span class="task-arg">（' + escapeHtml(cur.arg) + '）</span>' : '') +
      ' <span class="stepno">第 ' + cur.step + ' 步</span></span>';
  } else {
    now.classList.remove("err", "done");
    now.innerHTML = '<span class="spinner"></span><span class="now-text">思考中...</span>';
  }
}

/* 进度条：有计划按步骤数，无计划显示已执行步数 + 流动动画 */
function updateProgress(panel) {
  var bar = panel.querySelector(".task-progress .bar");
  var txt = panel.querySelector(".task-progress .txt");
  if (!bar || !txt) return;
  if (panel._planSteps > 0) {
    bar.classList.remove("indeterminate");
    var pct = Math.min(100, Math.round(panel._planDone / panel._planSteps * 100));
    bar.querySelector("i").style.width = pct + "%";
    txt.textContent = panel._planDone + "/" + panel._planSteps + " 步";
  } else {
    bar.classList.add("indeterminate");
    txt.textContent = "已执行 " + panel._toolSeq.length + " 步";
  }
}

/* 执行流水：默认只显示最近 3 条 + 进行中，可展开全部 */
function refreshFlowVisibility(panel) {
  var flow = panel.querySelector(".task-flow");
  var head = panel.querySelector(".task-flow-head");
  var count = panel.querySelector(".task-flow-head .count");
  var toggle = panel.querySelector(".task-flow-head .toggle");
  if (!flow || !head) return;
  var rows = flow.querySelectorAll(".tl");
  var total = rows.length;
  count.textContent = total;
  if (!total) { head.style.display = "none"; return; }
  head.style.display = "flex";
  var showAll = panel._flowExpanded || total <= 4;
  var visible = 0;
  for (var i = 0; i < rows.length; i++) {
    var isRun = rows[i].classList.contains("run");
    if (showAll || isRun || i >= rows.length - 3) { rows[i].style.display = "flex"; visible++; }
    else rows[i].style.display = "none";
  }
  toggle.textContent = showAll ? (total > 4 ? "收起" : "") : ("展开 " + (total - visible) + " 条");
}

function addFlowLine(panel, step) {
  var t = panel._tools[step];
  if (!t) return;
  var flow = panel.querySelector(".task-flow");
  var row = flow.querySelector('[data-step="' + step + '"]');
  if (!row) {
    row = document.createElement("div");
    row.className = "tl";
    row.dataset.step = step;
    row.innerHTML = '<span class="st"></span><span class="ts"></span><span class="nm"></span>';
    flow.appendChild(row);
  }
  var icon = t.status === "ok" ? "✓" : (t.status === "err" ? "✗" : "▶");
  row.querySelector(".st").textContent = icon;
  row.querySelector(".ts").textContent = fmtClock(t.ts);
  if (t.arg === undefined) t.arg = argsSummary(t.args);
  var act = toolAction(t.name);
  row.querySelector(".nm").innerHTML = '<span class="actv">' + escapeHtml(act.v) + '</span> ' +
    escapeHtml(act.zh) +
    (t.arg ? ' <span class="flow-obj">（' + escapeHtml(t.arg) + '）</span>' : '');
  row.className = "tl " + t.status;
  refreshFlowVisibility(panel);
}

function renderPlan(panel, plan) {
  var box = panel.querySelector(".task-plan");
  if (!box || !plan || !plan.steps) return;
  var t = panel.querySelector(".task-type");
  if (t && plan.type) t.textContent = taskTypeName(plan.type);
  var gmap = {};
  (plan.groups || []).forEach(function(g){ gmap[g.id] = g.title; });
  var steps = plan.steps || [];
  var done = 0, fail = 0, firstTodo = null;
  steps.forEach(function(s){
    if (s.status === "done") done++;
    else if (s.status === "fail") fail++;
    else if (!firstTodo) firstTodo = s;
  });
  panel._planSteps = steps.length;
  panel._planDone = done + fail;
  var curId = firstTodo ? firstTodo.id : null;
  var html = "", shown = {};
  steps.forEach(function(s){
    var g = s.group;
    if (g && !shown[g]) { shown[g] = true; html += '<div class="pg">▸ ' + escapeHtml(gmap[g]||g) + '</div>'; }
    var cls = "ps " + (s.status || "todo");
    if (s.id === curId) cls += " cur";
    var icon = s.status === "done" ? "✓" : (s.status === "fail" ? "✗" : (s.id === curId ? "▶" : "○"));
    html += '<div class="' + cls + '">' + icon + ' ' + escapeHtml(s.title) + '</div>';
  });
  box.innerHTML = html;
  // 计划区内部滚动到当前步骤可见
  if (curId) {
    var curEl = box.querySelector(".ps.cur");
    if (curEl) box.scrollTop = Math.max(0, curEl.offsetTop - box.clientHeight / 2);
  }
  updateProgress(panel);
  maybeScroll();
}

function renderEvent(panel, ev) {
  if (!ev || !ev.type) return;
  if (ev.type === "type") {
    var t = panel.querySelector(".task-type");
    if (t) t.textContent = taskTypeName(ev.task_type);
  } else if (ev.type === "plan") {
    renderPlan(panel, ev.plan);
  } else if (ev.type === "think") {
    updateNow(panel);  // 无运行中工具时状态条显示思考中
    var th = panel.querySelector(".task-think");
    if (th) {
      if (ev.reasoning) {
        th.textContent = ev.reasoning.replace(/\s+/g, " ").slice(0, 160);
        th.style.display = "block";
      } else {
        th.style.display = "none";
      }
    }
  } else if (ev.type === "tool") {
    panel._tools[ev.step] = {name: ev.name, args: ev.args, ts: Date.now(), status: "run"};
    if (panel._toolSeq.indexOf(ev.step) < 0) panel._toolSeq.push(ev.step);
    addFlowLine(panel, ev.step);
    updateNow(panel);
    updateProgress(panel);
    maybeScroll();
  } else if (ev.type === "stage") {
    var t2 = panel._tools[ev.step];
    if (t2) { t2.status = ev.ok ? "ok" : "err"; addFlowLine(panel, ev.step); }
    updateNow(panel);
    updateProgress(panel);
  }
}

function fmtElapsed(ms) {
  var s = Math.round(ms / 1000);
  if (s < 60) return s + "s";
  var m = Math.floor(s / 60); s = s % 60;
  return m + "m" + (s < 10 ? "0" : "") + s + "s";
}

/* 任务完成/失败：卡片转摘要态（保留执行轨迹，可点"回顾"展开），下方追加最终回复 */
function finishTaskPanel(panel, ok) {
  var statusEl = panel.querySelector(".task-status");
  statusEl.textContent = ok ? "✓ 已完成" : "✗ 失败";
  statusEl.className = "task-status" + (ok ? " done" : " err");
  var now = panel.querySelector(".task-now");
  now.classList.remove("err");
  now.classList.add(ok ? "done" : "err");
  var elapsed = fmtElapsed(Date.now() - panel._t0);
  var th = panel.querySelector(".task-think");
  if (th) th.style.display = "none";
  now.innerHTML = (ok ? "✓ 任务完成" : "✗ 任务失败") + " · 用时 " + elapsed +
    " · " + panel._toolSeq.length + " 步工具调用";
  var bar = panel.querySelector(".task-progress .bar");
  if (bar) {
    bar.classList.remove("indeterminate");
    var pct = panel._planSteps > 0 ? Math.round(panel._planDone / panel._planSteps * 100) : 100;
    bar.querySelector("i").style.width = (ok ? 100 : Math.min(pct, 100)) + "%";
  }
  var txt = panel.querySelector(".task-progress .txt");
  if (txt) txt.textContent = ok ? "完成" : "失败";
  // 默认收起计划与流水（保持清爽），提供"回顾"展开
  panel.querySelector(".task-plan").style.display = "none";
  var head = panel.querySelector(".task-flow-head");
  head.style.display = "none";
  panel._flowExpanded = false;
  refreshFlowVisibility(panel);
  var review = document.createElement("span");
  review.className = "task-review";
  review.textContent = "回顾";
  review.addEventListener("click", function(e){
    e.stopPropagation();
    var planBox = panel.querySelector(".task-plan");
    panel._reviewing = !panel._reviewing;
    if (panel._reviewing) {
      planBox.style.display = "block";
      head.style.display = "flex";
      refreshFlowVisibility(panel);
      review.textContent = "收起";
      maybeScroll();
    } else {
      planBox.style.display = "none";
      head.style.display = "none";
      review.textContent = "回顾";
    }
  });
  head.appendChild(review);
  panel._done = ok;
  maybeScroll();
}

function renderTaskDone(panel, reply) {
  finishTaskPanel(panel, true);
  addMsg("bailing", renderMd(reply || "（完成）"));
  sendBtn.disabled = false;  // 任务完成 → 恢复发送
  input.focus();
}

function renderTaskError(panel, error) {
  finishTaskPanel(panel, false);
  addMsg("bailing", '<span style="color:#DC2626;">出错了：'+escapeHtml(error||"未知错误")+"</span>");
  sendBtn.disabled = false;  // 任务出错 → 恢复发送
  input.focus();
}

function pollTask(panel, tid) {
  var seen = 0;
  var timer = setInterval(function(){
    fetch("/api/task/" + tid + "?since=" + seen).then(function(r){ return r.json(); }).then(function(d){
      if (!d.ok) { clearInterval(timer); renderTaskError(panel, d.error||"任务不存在"); return; }
      for (var i = 0; i < (d.events||[]).length; i++) renderEvent(panel, d.events[i]);
      seen = (typeof d.next === "number") ? d.next : seen + (d.events||[]).length;
      if (d.status === "done") { clearInterval(timer); renderTaskDone(panel, d.reply); }
      else if (d.status === "error") { clearInterval(timer); renderTaskError(panel, d.error); }
    }).catch(function(){});
  }, 800);
}

function send() {
  var msg = input.value.trim();
  if (!msg || sendBtn.disabled) return;
  addMsg("user", escapeHtml(msg).replace(/\n/g,"<br>"));
  input.value = "";
  input.style.height = "auto";
  sendBtn.disabled = true;
  var panel = addTaskPanel(msg);
  fetch("/api/chat", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({message: msg})
  }).then(function(r){ return r.json().then(function(d){ return {status:r.status, d:d}; }); }).then(function(o){
    var d = o.d;
    if (d.ok) {
      pollTask(panel, d.task_id);
    } else if (o.status === 503) {
      renderTaskError(panel, "白绫还在初始化中，请稍候再试。");
      sendBtn.disabled = false;
      input.focus();
    } else {
      renderTaskError(panel, d.error||"未知错误");
      sendBtn.disabled = false;
      input.focus();
    }
  }).catch(function(e){
    renderTaskError(panel, "请求失败：" + String(e) + "。请确认服务端在运行。");
    sendBtn.disabled = false;
    input.focus();
  });
}

/* 状态栏：轮询直至白绫就绪 */
var statusTimer = null;
function loadStatus() {
  fetch("/api/status").then(function(r){return r.json();}).then(function(d){
    var b = document.getElementById("badges");
    if (!d.ok) { b.innerHTML = '<span class="badge gray">状态未知</span>'; return; }
    if (!d.ready) {
      b.innerHTML = '<span class="badge gray">白绫初始化中...</span>';
      if (!statusTimer) statusTimer = setInterval(loadStatus, 2000);
      return;
    }
    if (statusTimer) { clearInterval(statusTimer); statusTimer = null; }
    var modeMap = {FIRST_BOOT:"首次觉醒", RECOVERY_BOOT:"恢复启动", NORMAL_BOOT:"正常启动"};
    var mode = modeMap[d.boot_mode] || d.boot_mode || "?";
    var emo = d.emotion && (d.emotion.current || d.emotion.mood || d.emotion.mood_name || "");
    var emoInt = d.emotion ? (Math.round((d.emotion.intensity || 0) * 100)) : 0;
    var html = '<span class="badge gray">'+escapeHtml(mode)+'</span>';
    if (emo) html += '<span class="badge" title="感受强度 '+emoInt+'%">情绪·'+escapeHtml(emo)+'</span>';
    html += '<span class="badge">记忆 '+d.memory_count+'</span>';
    html += '<span class="badge">方法论 '+d.method_count+'</span>';
    b.innerHTML = html;
  }).catch(function(){ if(!statusTimer) statusTimer = setInterval(loadStatus, 2000); });
}

/* 输入 */
input.addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  if (e.key === "Escape") { input.value = ""; }
});
input.addEventListener("input", function(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

/* ---------- AI 接入配置面板 ---------- */
var cfgLoaded = false;
var _models = [];
var _curMask = "";  // 当前已配置 Key 的打码串（用于判断用户是否改动了 Key）
function fillModelList(models, hint) {
  _models = models || [];
  var box = document.getElementById("cfgMList");
  box.innerHTML = "";
  if (!_models.length) {
    var e = document.createElement("div");
    e.className = "mi empty";
    e.textContent = "（无模型，点\"获取模型\"拉取）";
    box.appendChild(e);
  } else {
    _models.forEach(function(m){
      var d = document.createElement("div");
      d.className = "mi";
      d.textContent = m;
      d.onclick = function(){ document.getElementById("cfgModel").value = m; hideModels(); };
      box.appendChild(d);
    });
  }
  document.getElementById("cfgModelHint").textContent =
      hint || (_models.length ? "已加载 " + _models.length + " 个模型" : "");
}
function showModels() {
  if (!_models.length) return;
  var box = document.getElementById("cfgMList");
  box.querySelectorAll(".mi").forEach(function(d){
    if (!d.classList.contains("empty")) d.style.display = "";
  });
  document.getElementById("cfgMList").classList.add("show");
}
function hideModels() { document.getElementById("cfgMList").classList.remove("show"); }
document.addEventListener("click", function(e){
  if (!e.target.closest(".cfg-combo")) hideModels();
});
function loadModelCache() {
  fetch("/api/models").then(function(r){return r.json();}).then(function(d){
    if (!d.ok) return;
    var curBase = (document.getElementById("cfgBase").value || "").trim().replace(/\/+$/, "");
    var srcBase = (d.models_base_url || "").replace(/\/+$/, "");
    var hint;
    if (!d.models || !d.models.length) {
      hint = "尚未获取过模型列表，可点\"获取模型\"自动获取";
    } else if (curBase && srcBase && curBase !== srcBase) {
      hint = "列表属于 " + srcBase + "（与当前 API 地址不同），建议点\"获取模型\"刷新";
    } else {
      hint = "已缓存 " + d.models.length + " 个模型（可点\"获取模型\"刷新）";
    }
    fillModelList(d.models, hint);
  }).catch(function(){});
}
function fetchModels() {
  var btn = document.getElementById("cfgFetchModels");
  btn.disabled = true;
  cfgMsg("正在获取模型列表...", false);
  fetch("/api/models/fetch", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(cfgPayload())
  }).then(function(r){return r.json();}).then(function(d){
    btn.disabled = false;
    if (d.ok && d.models && d.models.length) {
      fillModelList(d.models, "已获取 " + d.models.length + " 个模型并保存（来自当前 API 地址），点击下拉查看");
      var cur = document.getElementById("cfgModel").value.trim();
      if (!cur) {
        document.getElementById("cfgModel").value =
            (d.models.indexOf("deepseek-chat") >= 0) ? "deepseek-chat" : d.models[0];
      }
      showModels(true);  // 强制展开全部模型（不受输入框旧值过滤影响）
      cfgMsg("模型列表已更新 ✓", false);
    } else {
      cfgMsg("获取失败：" + (d.error || "未知错误"), true);
    }
  }).catch(function(e){ btn.disabled = false; cfgMsg("获取失败：" + e, true); });
}
function openCfg() {
  document.getElementById("cfgModal").style.display = "flex";
  loadModelCache();
  if (cfgLoaded) return;
  fetch("/api/config").then(function(r){return r.json();}).then(function(d){
    cfgLoaded = true;
    if (!d.ok) { cfgMsg("读取配置失败：" + (d.error || "未知错误"), true); return; }
    document.getElementById("cfgBase").value = d.base_url || "";
    document.getElementById("cfgModel").value = d.model || "";
    document.getElementById("cfgTemp").value = d.temperature != null ? d.temperature : 0.7;
    document.getElementById("cfgTokens").value = d.max_tokens != null ? d.max_tokens : 4096;
    // Key：打码回填到密码框（直观看到"已配置"），用户不改动则保存时保留原值
    var m = d.api_key_masked || "";
    _curMask = m;
    document.getElementById("cfgKey").value = m;
    document.getElementById("cfgKeyMask").textContent = d.has_key
        ? "当前已配置 Key：" + m + "（不修改直接保存 = 保留原值；重新输入 = 更新）"
        : "尚未配置 API Key（填写并保存后生效）";
  }).catch(function(e){ cfgMsg("读取配置失败：" + e, true); });
}
function closeCfg() { document.getElementById("cfgModal").style.display = "none"; }
function cfgMsg(t, isErr) {
  var el = document.getElementById("cfgMsg");
  el.textContent = t;
  el.className = "cfg-msg " + (isErr ? "err" : "ok");
}
function cfgPayload() {
  var k = document.getElementById("cfgKey").value;
  // Key 未改动（空 或 仍是打码回填值）→ 传空 = 后端保留原值
  var newKey = (k && k !== _curMask) ? k : "";
  return {
    base_url: document.getElementById("cfgBase").value.trim(),
    api_key: newKey,
    model: document.getElementById("cfgModel").value.trim(),
    temperature: document.getElementById("cfgTemp").value,
    max_tokens: document.getElementById("cfgTokens").value
  };
}
function saveCfg() {
  var btn = document.querySelector(".btn-primary");
  btn.disabled = true; cfgMsg("保存并重载中...", false);
  fetch("/api/config", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(cfgPayload())
  }).then(function(r){return r.json();}).then(function(d){
    btn.disabled = false;
    if (!d.ok) { cfgMsg("保存失败：" + (d.error || "未知错误"), true); return; }
    // 保存成功后打码回填（新 Key 生效则更新打码串）
    var m = d.api_key_masked || "";
    _curMask = m;
    document.getElementById("cfgKey").value = m;
    document.getElementById("cfgKeyMask").textContent =
        (d.has_key ? "当前已配置 Key：" + m + "（不修改直接保存 = 保留原值；重新输入 = 更新）"
                   : "尚未配置 API Key（填写并保存后生效）");
    cfgMsg(d.llm_ready ? "已保存并生效 ✓" : "已保存，但 LLM 未就绪：" + (d.error || "缺少 API Key"), !d.llm_ready);
    loadStatus();
  }).catch(function(e){ btn.disabled = false; cfgMsg("保存失败：" + e, true); });
}
function testCfg() {
  var btn = document.querySelectorAll(".btn-ghost")[0];
  btn.disabled = true; cfgMsg("正在测试连接...", false);
  fetch("/api/config/test", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(cfgPayload())
  }).then(function(r){return r.json();}).then(function(d){
    btn.disabled = false;
    if (d.ok && d.reply) cfgMsg("连接成功 ✓ 模型回复：" + d.reply, false);
    else cfgMsg("连接失败：" + (d.error || "未知错误"), true);
  }).catch(function(e){ btn.disabled = false; cfgMsg("测试失败：" + e, true); });
}
function preset(name) {
  var map = {
    deepseek:  ["https://api.deepseek.com", "deepseek-chat"],
    openai:    ["https://api.openai.com/v1", "gpt-4o-mini"],
    grok:      ["https://api.x.ai/v1", "grok-3-mini"],
    ollama:    ["http://127.0.0.1:11434/v1", "llama3"],
    moonshot:  ["https://api.moonshot.cn/v1", "moonshot-v1-8k"]
  };
  var v = map[name];
  if (!v) return;
  document.getElementById("cfgBase").value = v[0];
  document.getElementById("cfgModel").value = v[1];
}
document.getElementById("cfgModal").addEventListener("click", function(e){
  if (e.target === this) closeCfg();
});
